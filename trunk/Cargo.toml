[package]
name = "bifrost-net"
version = "1.0.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
base64 = "0.23.1"
boringtun = "0.7.1"
etherparse = { version = "0.21.0", optional = true }
rand_core = { version = "0.6.4", features = ["getrandom"] }
str0m = { version = "0.24.0", optional = true }
tiny_http = "0.12.0"
toml = "1.1.6"
serde_json = "1"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
opus = { version = "0.3", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
tracing = { version = "0.1", optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"], optional = true }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"], optional = true }
sha1 = "0.10"
webpki-roots = "0.26"
# Ed25519 + sha256 for trunk v1 (proto 2, signed directory, PASETO): already in every build via
# boringtun/rustls/ureq, so a direct dependency costs nothing — the root build verifies the directory too
ring = "0.17"
smoltcp = { version = "0.12", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp"] }
# v1 trunk (`bifrost-net trunk` / `trunk-ctl`, src/v1/): identity, tokens, audit, shell pages
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
subtle = { version = "2.6", optional = true }
argon2 = { version = "0.5", optional = true }
flate2 = { version = "1", optional = true }
qrcode = { version = "0.14", default-features = false, features = ["svg"], optional = true }

[features]
# The full bifrost-net: the bridge (WebRTC, voice, speech), the access point, the mesh lab. Its
# native parts need cmake and system libraries (libopus; aws-lc-sys under str0m).
default = ["bridge", "trunk"]
bridge = ["dep:etherparse", "dep:str0m", "dep:opus", "dep:tracing-subscriber", "dep:tracing", "dep:webpki", "dep:rcgen"]
# The v1 trunk server and its console (src/v1/). Pure Rust plus ring's and SQLite's C (any C compiler).
# (ring itself is not optional: the root build checks the trunk's signed directory too)
trunk = ["dep:rusqlite", "dep:subtle", "dep:argon2", "dep:flate2", "dep:qrcode"]
# `cargo build --release --no-default-features`: the ROOT build — what a joined root runs
# (keygen, root-key, wg-key, wg, bridge [trunk] light link, rootlink mint). Pure Rust plus ring's C (any C compiler): no cmake, no libopus.
