<header class="oz-head"><a class="oz-brand" href="/">BIFROST</a><span class="head-r"><a class="pill" href="/devices">devices</a></span></header>

<section class="oz-blk" id="p-qr">
  <h2>pair your phone<span class="r">one scan · member</span></h2>
  <div>
    <p class="lead">Scan with the camera app or the Bifrost app on the phone you want to add. One QR pairs one phone — it dies on first scan.</p>
    <div class="pair-qr" id="p-qr-box"><div class="qr" id="p-qr-img"></div><p class="dim small" id="p-qr-count"></p></div>
    <div class="row">
      <button class="oz-k grow" id="p-regen" type="button">Regenerate</button>
      <button class="oz-k grow" id="p-done" type="button">Done</button>
    </div>
    <p class="msg" id="p-msg" hidden></p>
  </div>
</section>

<section class="oz-blk" id="p-joined" hidden>
  <h2>joined<span class="r ok" id="p-joined-role">member</span></h2>
  <div>
    <p class="lead" id="p-joined-line"></p>
    <a class="oz-k ok full" href="/devices">See devices →</a>
  </div>
</section>

<section class="oz-blk" id="p-burned" hidden>
  <h2>pairing stopped</h2>
  <div>
    <p class="lead" id="p-burned-line"></p>
    <a class="oz-k full" href="/devices">Back to devices</a>
  </div>
</section>
