<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 486" width="1120" height="486" role="img" aria-label="Architecture schematic: branches (phone chat, web app, voice) connect through a safe trunk (one small server carrying scrambled bytes, reviewed by latest models) to roots (your Linux, Mac, and Windows machines).">
  <rect x="0.75" y="0.75" width="1118.5" height="484.5" rx="12" fill="#080810" stroke="#20263b" stroke-width="1.5"/>

  <!-- TOP TIER: BRANCHES -->
  <g transform="translate(0, 34)">
    <g transform="translate(405, 0)">
      <rect x="0" y="3" width="9" height="9" fill="#38bdf8"/>
      <text x="17" y="12" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="600" fill="#38bdf8">branches</text>
      <text x="95" y="12" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace" font-size="14" fill="#8d94ae">·</text>
      <text x="111" y="12" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="600" fill="#eef0f8">the surfaces you hold.</text>
    </g>
    <text x="560" y="34" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#8d94ae">every one reaches the whole tree</text>

    <!-- 3 Branch icons at x=300, 560, 820 -->
    <!-- Phone chat (x=300) -->
    <g transform="translate(278, 48)">
      <rect x="11" y="2" width="22" height="40" rx="3" fill="#0f1f30" stroke="#38bdf8" stroke-width="1.8"/>
      <rect x="18" y="6" width="8" height="1.8" rx="0.9" fill="#38bdf8" opacity="0.65"/>
      <rect x="15" y="12" width="11" height="5" rx="1.2" fill="#eef0f8" opacity="0.85"/>
      <rect x="18" y="20" width="11" height="5" rx="1.2" fill="#38bdf8"/>
      <rect x="15" y="28" width="8" height="4" rx="1.2" fill="#eef0f8" opacity="0.45"/>
      <text x="22" y="59" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#8d94ae">phone chat</text>
    </g>

    <!-- Web app (x=560) -->
    <g transform="translate(538, 48)">
      <rect x="2" y="6" width="40" height="32" rx="2.5" fill="#0f1f30" stroke="#38bdf8" stroke-width="1.8"/>
      <line x1="2" y1="13.5" x2="42" y2="13.5" stroke="#38bdf8" stroke-width="1.4" opacity="0.6"/>
      <circle cx="7" cy="9.8" r="1.3" fill="#38bdf8"/>
      <circle cx="11.5" cy="9.8" r="1.3" fill="#38bdf8" opacity="0.6"/>
      <circle cx="16" cy="9.8" r="1.3" fill="#38bdf8" opacity="0.35"/>
      <rect x="6" y="17.5" width="9" height="16.5" rx="1.2" fill="#38bdf8" opacity="0.28"/>
      <rect x="19" y="18" width="18" height="3.4" rx="1" fill="#eef0f8" opacity="0.85"/>
      <rect x="19" y="24.5" width="13" height="3.4" rx="1" fill="#38bdf8" opacity="0.85"/>
      <rect x="19" y="30.5" width="15" height="2.6" rx="1" fill="#eef0f8" opacity="0.35"/>
      <text x="22" y="59" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#8d94ae">web app</text>
    </g>

    <!-- Voice (x=820) -->
    <g transform="translate(798, 48)">
      <circle cx="22" cy="22" r="19" fill="#0f1f30" stroke="#38bdf8" stroke-width="1.8"/>
      <rect x="11" y="18" width="3" height="8" rx="1.5" fill="#38bdf8" opacity="0.55"/>
      <rect x="16" y="13" width="3" height="18" rx="1.5" fill="#38bdf8" opacity="0.85"/>
      <rect x="20.5" y="9" width="3" height="26" rx="1.5" fill="#eef0f8"/>
      <rect x="25" y="13.5" width="3" height="17" rx="1.5" fill="#38bdf8" opacity="0.85"/>
      <rect x="30" y="18" width="3" height="8" rx="1.5" fill="#38bdf8" opacity="0.55"/>
      <text x="22" y="59" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#8d94ae">voice</text>
    </g>
  </g>

  <!-- UPPER 45-DEGREE CIRCUIT WIRES (y=152 -> y=194) -->
  <g fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.55" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M300 152 V164 L314 178 H538 L548 188 V194"/>
    <path d="M560 152 V194"/>
    <path d="M820 152 V164 L806 178 H582 L572 188 V194"/>
  </g>
  <g fill="#38bdf8">
    <rect x="297.5" y="149" width="5" height="5"/>
    <rect x="557.5" y="149" width="5" height="5"/>
    <rect x="817.5" y="149" width="5" height="5"/>
  </g>

  <!-- MIDDLE TIER: TRUNK INSIDE A FLAT-GEOMETRIC SAFE (y=194..310) -->
  <g transform="translate(274, 194)">
    <!-- Safe hinges (left) and latch (right) -->
    <rect x="-7" y="48" width="6" height="16" rx="1.5" fill="#fbbf24"/>
    <rect x="-7" y="78" width="6" height="16" rx="1.5" fill="#fbbf24"/>
    <rect x="573" y="58" width="5" height="28" rx="1.5" fill="#fbbf24"/>

    <!-- Main safe body -->
    <rect x="0" y="0" width="572" height="116" rx="6" fill="#0d0f18" stroke="#b88b1e" stroke-width="1.8"/>

    <!-- Top nameplate bar -->
    <path d="M1 6 a5 5 0 0 1 5 -5 h560 a5 5 0 0 1 5 5 v27 H1 Z" fill="#241e10"/>
    <line x1="1" y1="33" x2="571" y2="33" stroke="#b88b1e" stroke-width="1" opacity="0.55"/>

    <!-- Padlock icon + safe label -->
    <g transform="translate(152, 9)">
      <path d="M4.5 7V5.2a3.5 3.5 0 0 1 7 0V7" fill="none" stroke="#fbbf24" stroke-width="1.6" stroke-linecap="round"/>
      <rect x="2.5" y="7" width="11" height="7.5" rx="1.5" fill="#fbbf24"/>
      <circle cx="8" cy="10.4" r="1.2" fill="#241e10"/>
      <line x1="8" y1="10.8" x2="8" y2="12.8" stroke="#241e10" stroke-width="1.2" stroke-linecap="round"/>
      <text x="24" y="12.5" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="600" fill="#fbbf24">safe — reviewed by latest models</text>
    </g>

    <!-- Server icon inside safe -->
    <g transform="translate(24, 50)">
      <rect x="0" y="2" width="44" height="18" rx="2.5" fill="#171b2e" stroke="#fbbf24" stroke-width="1.7"/>
      <circle cx="8" cy="11" r="2.4" fill="#4ade80"/>
      <rect x="14.5" y="9.5" width="14" height="3" rx="1" fill="#eef0f8" opacity="0.55"/>
      <rect x="32" y="9.5" width="7" height="3" rx="1" fill="#fbbf24" opacity="0.8"/>

      <rect x="0" y="26" width="44" height="18" rx="2.5" fill="#171b2e" stroke="#fbbf24" stroke-width="1.7"/>
      <circle cx="8" cy="35" r="2.4" fill="#fbbf24"/>
      <rect x="14.5" y="33.5" width="14" height="3" rx="1" fill="#eef0f8" opacity="0.55"/>
      <rect x="32" y="33.5" width="7" height="3" rx="1" fill="#fbbf24" opacity="0.45"/>
    </g>

    <!-- Trunk text -->
    <g transform="translate(88, 63)">
      <rect x="0" y="-9" width="8.5" height="8.5" fill="#fbbf24"/>
      <text x="16" y="0" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="600" fill="#fbbf24">trunk</text>
      <text x="66" y="0" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace" font-size="14" fill="#8d94ae">·</text>
      <text x="82" y="0" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="600" fill="#eef0f8">the brain, the hub.</text>
      <text x="0" y="22" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#8d94ae">one small server you rent: carries your turns as</text>
      <text x="0" y="40" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#8d94ae">scrambled bytes — holds no key to read them.</text>
    </g>
  </g>

  <!-- LOWER 45-DEGREE CIRCUIT WIRES (y=310 -> y=352) -->
  <g fill="none" stroke="#4ade80" stroke-width="1.8" opacity="0.55" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M548 310 V316 L538 326 H314 L300 340 V350"/>
    <path d="M560 310 V350"/>
    <path d="M572 310 V316 L582 326 H806 L820 340 V350"/>
  </g>
  <g fill="#4ade80">
    <rect x="297.5" y="347" width="5" height="5"/>
    <rect x="557.5" y="347" width="5" height="5"/>
    <rect x="817.5" y="347" width="5" height="5"/>
  </g>

  <!-- BOTTOM TIER: ROOTS -->
  <g transform="translate(0, 358)">
    <!-- Home PC (x=300) -->
    <g transform="translate(278, 0)">
      <rect x="3" y="4" width="38" height="26" rx="2.5" fill="#0d2218" stroke="#4ade80" stroke-width="1.8"/>
      <path d="M11 14l4.5 3.2-4.5 3.2M19 20.4h8" fill="none" stroke="#4ade80" stroke-width="1.8" stroke-linecap="square"/>
      <path d="M17 30v5.5M27 30v5.5M12 35.5h20" stroke="#4ade80" stroke-width="1.8" stroke-linecap="square"/>
      <text x="22" y="54" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#8d94ae">home pc</text>
    </g>

    <!-- Mac / Laptop (x=560) -->
    <g transform="translate(538, 0)">
      <rect x="6" y="7" width="32" height="22" rx="2.2" fill="#0d2218" stroke="#4ade80" stroke-width="1.8"/>
      <path d="M13 15l4 2.8-4 2.8M20 20.6h7" fill="none" stroke="#4ade80" stroke-width="1.8" stroke-linecap="square"/>
      <line x1="2" y1="33" x2="42" y2="33" stroke="#4ade80" stroke-width="2.6" stroke-linecap="round"/>
      <text x="22" y="54" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#8d94ae">mac / laptop</text>
    </g>

    <!-- + more (x=820) -->
    <g transform="translate(798, 0)">
      <rect x="5" y="5" width="34" height="30" rx="2.5" fill="#0d2218" fill-opacity="0.5" stroke="#4ade80" stroke-width="1.6" stroke-dasharray="4 3" opacity="0.8"/>
      <path d="M22 14v12M16 20h12" stroke="#4ade80" stroke-width="2" stroke-linecap="square"/>
      <text x="22" y="54" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#8d94ae">+ any machine</text>
    </g>

    <!-- Roots caption -->
    <g transform="translate(454, 74)">
      <rect x="0" y="3" width="9" height="9" fill="#4ade80"/>
      <text x="17" y="12" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="600" fill="#4ade80">roots</text>
      <text x="69" y="12" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace" font-size="14" fill="#8d94ae">·</text>
      <text x="85" y="12" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="600" fill="#eef0f8">your machines.</text>
    </g>
    <text x="560" y="106" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#8d94ae">a brain on each computer you own — dials out, no open port at home</text>
  </g>
</svg>
